<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Study Setlist — Roteiro A2→B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181C;
    --ink-soft:#1D2329;
    --ink-softer:#242B32;
    --paper:#EDEAE2;
    --paper-dim:#B9B6AC;
    --lime:#C8FF4D;
    --coral:#FF6B5B;
    --amber:#FFB84D;
    --blue:#6FB8FF;
    --violet:#C99BFF;
    --line: rgba(237,234,226,0.10);
    --line-strong: rgba(237,234,226,0.20);
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Work Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--lime);color:var(--ink);}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg, var(--ink) 70%, rgba(20,24,28,0.85));
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    padding:18px 24px 14px;
  }
  .topbar-inner{
    max-width:1100px;margin:0 auto;
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
  }
  .brand-eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--lime);margin:0 0 4px;
  }
  .brand-title{
    font-family:var(--font-display);font-size:clamp(28px,4vw,42px);letter-spacing:.03em;
    margin:0;line-height:.95;color:var(--paper);
  }
  .brand-sub{
    font-family:var(--font-body);font-size:13px;color:var(--paper-dim);margin:4px 0 0;
  }
  .meter-wrap{
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:220px;
  }
  .meter-label{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);
  }
  .meter-row{display:flex;align-items:center;gap:10px;}
  .meter-track{
    width:180px;height:8px;background:var(--ink-softer);border-radius:2px;overflow:hidden;
    border:1px solid var(--line-strong);
    position:relative;
  }
  .meter-fill{
    height:100%;background:linear-gradient(90deg, var(--coral), var(--lime));
    width:0%;transition:width .5s cubic-bezier(.22,.9,.35,1);
    box-shadow:0 0 12px rgba(200,255,77,.35);
  }
  .meter-pct{
    font-family:var(--font-display);font-size:22px;color:var(--lime);min-width:52px;text-align:right;
  }

  /* ---------- TRACKLIST NAV ---------- */
  .tracknav-outer{
    max-width:1100px;margin:0 auto;padding:16px 24px 0;
  }
  .tracknav{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;
    scrollbar-width:thin;
  }
  .tracknav::-webkit-scrollbar{height:6px;}
  .tracknav::-webkit-scrollbar-thumb{background:var(--ink-softer);border-radius:3px;}
  .track-pill{
    flex:0 0 auto;
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    min-width:118px;
    transition:border-color .2s, background .2s, transform .15s;
    font-family:var(--font-body);
  }
  .track-pill:hover{border-color:var(--line-strong);transform:translateY(-1px);}
  .track-pill.active{
    background:var(--ink-softer);
    border-color:var(--lime);
    box-shadow:0 0 0 1px var(--lime) inset;
  }
  .track-pill-num{
    font-family:var(--font-mono);font-size:10px;color:var(--coral);letter-spacing:.08em;
  }
  .track-pill.active .track-pill-num{color:var(--lime);}
  .track-pill-name{
    font-size:12.5px;font-weight:600;color:var(--paper);margin-top:2px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;
  }
  .track-pill-frac{
    font-family:var(--font-mono);font-size:10px;color:var(--paper-dim);margin-top:6px;
  }
  .track-pill-frac b{color:var(--lime);font-weight:600;}

  /* ---------- MAIN / SLEEVE ---------- */
  main{max-width:1100px;margin:0 auto;padding:28px 24px 80px;}
  .sleeve{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .sleeve-head{
    padding:28px 28px 22px;
    border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;
  }
  .sleeve-num{
    font-family:var(--font-display);font-size:64px;color:var(--coral);line-height:1;
    opacity:.9;
  }
  .sleeve-titles .eyebrow{
    font-family:var(--font-mono);font-size:11px;color:var(--lime);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px;
  }
  .sleeve-titles h2{
    font-family:var(--font-display);font-size:clamp(26px,3.4vw,36px);letter-spacing:.02em;margin:0;color:var(--paper);
  }
  .sleeve-titles p{
    font-family:var(--font-body);color:var(--paper-dim);margin:6px 0 0;font-size:14.5px;
  }

  .grammar-box{
    margin:22px 28px 0;
    background:var(--ink-softer);
    border-left:3px solid var(--lime);
    border-radius:8px;
    padding:16px 18px;
  }
  .grammar-box .g-label{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin:0 0 6px;
  }
  .grammar-box h3{font-family:var(--font-display);font-size:22px;margin:0 0 8px;letter-spacing:.01em;font-weight:400;}
  .grammar-box p{margin:0 0 8px;font-size:14px;line-height:1.55;color:var(--paper);}
  .grammar-box .g-example{
    font-family:var(--font-mono);font-size:12.5px;color:var(--amber);background:rgba(255,184,77,0.08);
    padding:8px 10px;border-radius:6px;line-height:1.6;
  }

  section.block{margin:26px 28px 0;}
  .block-title{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim);
    margin:0 0 12px;display:flex;align-items:center;gap:8px;
  }
  .block-title::after{content:'';flex:1;height:1px;background:var(--line);}

  /* vocab */
  .vocab-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .vfilter{
    font-family:var(--font-mono);font-size:11px;padding:6px 12px;border-radius:20px;
    border:1px solid var(--line-strong);background:transparent;color:var(--paper-dim);cursor:pointer;
    transition:all .15s;
  }
  .vfilter:hover{color:var(--paper);}
  .vfilter.active{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:600;}
  .vocab-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;
    max-height:420px;overflow-y:auto;padding-right:4px;
  }
  .vocab-grid::-webkit-scrollbar{width:6px;}
  .vocab-grid::-webkit-scrollbar-thumb{background:var(--ink-softer);border-radius:3px;}
  .vcard{
    background:var(--ink-softer);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  }
  .vcard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .vcard .en{font-weight:600;font-size:13.5px;color:var(--paper);}
  .vcard .pt{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-dim);margin-top:3px;}
  .speak-btn{
    flex:0 0 auto;width:30px;height:30px;border:1px solid var(--line-strong);border-radius:50%;
    background:transparent;color:var(--paper);cursor:pointer;font-size:14px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .speak-btn:hover{background:rgba(200,255,77,.12);border-color:var(--lime);}
  .speak-btn.speaking{background:var(--lime);border-color:var(--lime);color:var(--ink);}
  .speak-btn:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
  .speech-status{min-height:18px;margin:0 0 8px;font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);}
  .vcard .tag{
    display:inline-block;margin-top:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;padding:2px 6px;border-radius:3px;
  }
  .tag-daily{background:rgba(237,234,226,.12);color:var(--paper-dim);}
  .tag-entrevista{background:rgba(255,184,77,.16);color:var(--amber);}
  .tag-intercambio{background:rgba(200,255,77,.14);color:var(--lime);}
  .tag-aeroporto{background:rgba(255,107,91,.16);color:var(--coral);}
  .tag-rua{background:rgba(201,155,255,.16);color:var(--violet);}
  .tag-restaurante{background:rgba(111,184,255,.16);color:var(--blue);}

  /* weekly quiz */
  .quiz-box{
    background:var(--ink-softer);border:1px solid var(--line);border-radius:10px;padding:18px;
  }
  .quiz-intro{margin:0 0 14px;color:var(--paper-dim);font-size:13px;line-height:1.6;}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .quiz-count,.quiz-score{font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);}
  .quiz-progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .quiz-progress-fill{height:100%;background:var(--lime);transition:width .2s ease;}
  .quiz-prompt-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:7px;}
  .quiz-prompt{font-size:19px;font-weight:600;color:var(--paper);margin-bottom:16px;line-height:1.4;}
  .quiz-answer{
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
    background:rgba(200,255,77,.08);border-left:3px solid var(--lime);border-radius:6px;margin-bottom:14px;
  }
  .quiz-answer-text{font-size:17px;font-weight:600;color:var(--lime);}
  .quiz-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .quiz-btn{
    font-family:var(--font-mono);font-size:11px;padding:8px 14px;border-radius:6px;
    border:1px solid var(--line-strong);background:transparent;color:var(--paper);cursor:pointer;
  }
  .quiz-btn:hover{border-color:var(--lime);}
  .quiz-btn.primary{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:600;}
  .quiz-btn.speaking{background:var(--amber);border-color:var(--amber);color:var(--ink);}
  .quiz-btn.correct{border-color:var(--lime);color:var(--lime);}
  .quiz-btn.review{border-color:var(--coral);color:var(--coral);}
  .quiz-result{text-align:center;padding:8px 0;}
  .quiz-result-score{font-family:var(--font-display);font-size:38px;color:var(--lime);margin-bottom:6px;}
  .quiz-result p{color:var(--paper-dim);margin:0 0 16px;}
  .quiz-review{font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);line-height:1.7;margin:0 0 16px;}
  .quiz-origin{display:inline-block;margin:0 0 10px;font-family:var(--font-mono);font-size:10px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;}
  .difficulty-bank{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;text-align:left;}
  .difficulty-bank summary{font-family:var(--font-mono);font-size:11px;color:var(--lime);cursor:pointer;}
  .difficulty-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .difficulty-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;font-size:12px;color:var(--paper);}
  .difficulty-item small{display:block;color:var(--paper-dim);margin-top:2px;}
  .difficulty-meta{font-family:var(--font-mono);font-size:10px;color:var(--paper-dim);white-space:nowrap;}
  .difficulty-empty{font-size:12px;color:var(--paper-dim);margin-top:10px;}

  /* dictation */
  .dictation-box{background:var(--ink-softer);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .dictation-intro{margin:0 0 14px;color:var(--paper-dim);font-size:13px;line-height:1.6;}
  .dictation-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .dictation-count,.dictation-score{font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);}
  .speed-control{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .speed-label{font-family:var(--font-mono);font-size:10px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.07em;margin-right:2px;}
  .speed-btn{font-family:var(--font-mono);font-size:10px;padding:5px 9px;border-radius:14px;border:1px solid var(--line-strong);background:transparent;color:var(--paper-dim);cursor:pointer;}
  .speed-btn[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:600;}
  .dictation-listen{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .dictation-input{width:100%;min-height:82px;resize:vertical;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:7px;background:var(--ink);color:var(--paper);padding:11px 12px;font:inherit;line-height:1.5;margin-bottom:10px;}
  .dictation-input:focus{outline:2px solid var(--lime);outline-offset:2px;}
  .dictation-hint{font-family:var(--font-mono);font-size:10px;color:var(--paper-dim);margin:0 0 12px;}
  .dictation-result{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;}
  .dictation-verdict{font-weight:600;margin-bottom:10px;}
  .dictation-verdict.good{color:var(--lime);}
  .dictation-verdict.needs-work{color:var(--coral);}
  .dictation-target{font-size:14px;color:var(--paper);line-height:1.6;margin-bottom:10px;}
  .dictation-diff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .diff-word{font-family:var(--font-mono);font-size:11px;padding:4px 6px;border-radius:4px;background:rgba(237,234,226,.08);color:var(--paper);}
  .diff-word.correct{color:var(--lime);background:rgba(200,255,77,.09);}
  .diff-word.wrong,.diff-word.missing{color:var(--coral);background:rgba(255,107,91,.1);}
  .diff-word.extra{color:var(--amber);background:rgba(255,184,77,.1);text-decoration:line-through;}
  .dictation-legend{font-family:var(--font-mono);font-size:10px;color:var(--paper-dim);line-height:1.6;margin-bottom:14px;}
  .dictation-summary{text-align:center;padding:8px 0;}
  .dictation-summary-score{font-family:var(--font-display);font-size:38px;color:var(--lime);margin-bottom:6px;}

  @media (max-width:520px){
    .difficulty-item{grid-template-columns:1fr;gap:3px;}
    .dictation-top{align-items:flex-start;}
  }

  /* resources / credits */
  .credits-list{display:flex;flex-direction:column;gap:8px;}
  .credit-row{
    display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .credit-row:last-child{border-bottom:none;}
  .credit-type{font-family:var(--font-mono);font-size:10.5px;color:var(--lime);text-transform:uppercase;letter-spacing:.06em;}
  .credit-name{color:var(--paper);font-weight:600;}
  .credit-link{color:var(--paper);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .credit-link:hover{color:var(--lime);text-decoration:underline;text-underline-offset:3px;}
  .credit-link:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:2px;}
  .credit-link-arrow{font-family:var(--font-mono);font-size:11px;color:var(--lime);}
  .credit-note{color:var(--paper-dim);font-size:12.5px;margin-top:2px;}

  /* setlist / days */
  .setlist{display:flex;flex-direction:column;gap:8px;}
  .day-row{
    background:var(--ink-softer);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    transition:border-color .2s;
  }
  .day-row.open{border-color:var(--line-strong);}
  .day-head{
    display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;user-select:none;
  }
  .day-check{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--paper-dim);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:var(--font-mono);font-size:12px;color:transparent;transition:all .2s;
  }
  .day-check.checked{
    background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:700;
  }
  .day-name{
    font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.06em;
    width:64px;flex:0 0 auto;
  }
  .day-label{flex:1;font-weight:600;font-size:14.5px;color:var(--paper);}
  .day-label.done{color:var(--paper-dim);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .day-time{
    font-family:var(--font-mono);font-size:12px;color:var(--amber);flex:0 0 auto;
  }
  .day-chevron{
    font-size:14px;color:var(--paper-dim);transition:transform .25s;flex:0 0 auto;
  }
  .day-row.open .day-chevron{transform:rotate(180deg);}
  .day-body{
    max-height:0;overflow:hidden;transition:max-height .3s ease;
  }
  .day-body-inner{padding:0 16px 16px 96px;}
  .day-block{
    display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5;
  }
  .day-block:first-child{border-top:1px solid var(--line);}
  .day-block-min{
    font-family:var(--font-mono);color:var(--coral);flex:0 0 auto;min-width:46px;font-size:12px;padding-top:1px;
  }
  .day-block-text{color:var(--paper);}

  footer{
    max-width:1100px;margin:0 auto;padding:0 24px 60px;
    font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);text-align:center;
  }

  @media (max-width:640px){
    .sleeve-head{grid-template-columns:1fr;}
    .sleeve-num{font-size:44px;}
    .day-body-inner{padding-left:16px;}
    .day-name{display:none;}
    .meter-wrap{align-items:flex-start;width:100%;}
    .meter-track{width:100%;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <p class="brand-eyebrow">Roteiro de 12 semanas · A2 → B1</p>
      <h1 class="brand-title">THE STUDY SETLIST</h1>
      <p class="brand-sub">Entrevista Dev · Intercâmbio em Malta · Aeroporto · Rua / Cidade · Restaurante</p>
    </div>
    <div class="meter-wrap">
      <span class="meter-label">Progresso geral</span>
      <div class="meter-row">
        <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
        <span class="meter-pct" id="meterPct">0%</span>
      </div>
      <span class="meter-label" id="meterFrac">0 / 84 dias</span>
    </div>
  </div>
</div>

<div class="tracknav-outer">
  <div class="tracknav" id="tracknav"></div>
</div>

<main>
  <div class="sleeve" id="sleeve"></div>
</main>

<script>

async function storageRead(key){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const result = await window.storage.get(key, false);
      if(result && result.value != null) return result.value;
    }
  }catch(e){ /* use browser fallback */ }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}

async function storageWrite(key, value){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, value, false);
      return;
    }
  }catch(e){ /* use browser fallback */ }
  try{ window.localStorage.setItem(key, value); }catch(e){ /* storage unavailable */ }
}

async function loadProgress(){
  try{
    const value = await storageRead(STORAGE_KEY);
    if(value) progress = JSON.parse(value);
  }catch(e){ progress = {}; }
  storageReady = true;
}
async function saveProgress(){
  await storageWrite(STORAGE_KEY, JSON.stringify(progress));
}

async function loadDifficultyBank(){
  try{
    const value = await storageRead(DIFFICULTY_STORAGE_KEY);
    difficultyBank = value ? JSON.parse(value) : {};
  }catch(e){ difficultyBank = {}; }
}

async function saveDifficultyBank(){
  await storageWrite(DIFFICULTY_STORAGE_KEY, JSON.stringify(difficultyBank));
}

function dayKey(weekN, dayCode){ return 'w'+weekN+'-'+dayCode; }

function totalDays(){ return WEEKS.length * WEEKS[0].days.length; }

function completedCount(){
  return Object.values(progress).filter(Boolean).length;
}

function weekCompletedCount(w){
  let c = 0;
  w.days.forEach(d => { if(progress[dayKey(w.n, d.code)]) c++; });
  return c;
}

function updateMeter(){
  const total = totalDays();
  const done = completedCount();
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('meterFill').style.width = pct + '%';
  document.getElementById('meterPct').textContent = pct + '%';
  document.getElementById('meterFrac').textContent = done + ' / ' + total + ' dias';
}

function setSpeechStatus(message, statusId = 'speechStatus'){
  const status = document.getElementById(statusId);
  if(status) status.textContent = message;
}

function speakEnglish(text, button, rate = 0.85, statusId = 'speechStatus'){
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    setSpeechStatus('A pronúncia por voz não está disponível neste navegador.', statusId);
    return;
  }

  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.speaking').forEach(el => el.classList.remove('speaking'));

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = rate;
  utterance.pitch = 1;

  const englishVoice = window.speechSynthesis.getVoices().find(voice =>
    /^en-US$/i.test(voice.lang)
  ) || window.speechSynthesis.getVoices().find(voice => /^en/i.test(voice.lang));
  if(englishVoice) utterance.voice = englishVoice;

  utterance.onstart = () => {
    button.classList.add('speaking');
    setSpeechStatus(`Reproduzindo em ${rate === 1 ? 'velocidade normal' : rate + 'x'}.`, statusId);
  };
  utterance.onend = () => {
    button.classList.remove('speaking');
    setSpeechStatus('', statusId);
  };
  utterance.onerror = () => {
    button.classList.remove('speaking');
    setSpeechStatus('Não foi possível reproduzir esta pronúncia.', statusId);
  };

  window.speechSynthesis.speak(utterance);
}

function shuffled(items){
  const copy = [...items];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function difficultyId(item){
  return `${item.sourceWeek}::${item.cat}::${item.en}`;
}

function dueDifficultyItems(){
  const now = Date.now();
  return Object.values(difficultyBank)
    .filter(item => item && item.en && item.pt && Number(item.dueAt || 0) <= now)
    .sort((a, b) => (Number(b.misses || 0) - Number(a.misses || 0)) || (Number(a.dueAt || 0) - Number(b.dueAt || 0)));
}

function buildQuizQuestions(w){
  const prioritized = dueDifficultyItems().slice(0, 4).map(item => ({...item, fromDifficulty: true}));
  const used = new Set(prioritized.map(difficultyId));
  const guaranteed = [];
  const remaining = [];

  Object.entries(w.vocab).forEach(([cat, items]) => {
    const available = items
      .map(item => ({...item, cat, sourceWeek: w.n, fromDifficulty: false}))
      .filter(item => !used.has(difficultyId(item)));
    if(!available.length) return;
    const chosenIndex = Math.floor(Math.random() * available.length);
    available.forEach((item, index) => {
      if(index === chosenIndex) guaranteed.push(item);
      else remaining.push(item);
    });
  });

  const selected = [...prioritized, ...guaranteed];
  const extrasNeeded = Math.max(0, 10 - selected.length);
  return shuffled([...selected, ...shuffled(remaining).slice(0, extrasNeeded)]).slice(0, 10);
}

function difficultyBankMarkup(){
  const items = Object.values(difficultyBank)
    .filter(item => item && item.en && item.pt)
    .sort((a, b) => (Number(b.misses || 0) - Number(a.misses || 0)) || (Number(a.dueAt || 0) - Number(b.dueAt || 0)));
  const dueCount = dueDifficultyItems().length;
  if(!items.length){
    return `
      <details class="difficulty-bank">
        <summary>Banco de dificuldades · vazio</summary>
        <div class="difficulty-empty">As palavras marcadas como “Rever depois” aparecerão aqui e voltarão aos próximos quizzes.</div>
      </details>
    `;
  }

  const preview = items.slice(0, 8).map(item => {
    const due = Number(item.dueAt || 0) <= Date.now();
    return `
      <div class="difficulty-item">
        <div>${item.pt} → <strong>${item.en}</strong><small>Semana ${item.sourceWeek} · ${CAT_LABEL[item.cat] || item.cat}</small></div>
        <span class="difficulty-meta">${due ? 'revisar agora' : 'agendada'} · ${item.misses || 1} erro${Number(item.misses || 1) === 1 ? '' : 's'}</span>
      </div>
    `;
  }).join('');

  return `
    <details class="difficulty-bank">
      <summary>Banco de dificuldades · ${items.length} item${items.length === 1 ? '' : 's'} · ${dueCount} para revisar agora</summary>
      <div class="difficulty-list">${preview}</div>
    </details>
  `;
}

async function updateDifficulty(question, remembered){
  const id = difficultyId(question);
  const current = difficultyBank[id];
  const now = Date.now();

  if(!remembered){
    difficultyBank[id] = {
      id,
      sourceWeek: question.sourceWeek,
      cat: question.cat,
      en: question.en,
      pt: question.pt,
      misses: Number(current?.misses || 0) + 1,
      streak: 0,
      lastReviewed: now,
      lastMissed: now,
      dueAt: now
    };
  }else if(current){
    const streak = Number(current.streak || 0) + 1;
    const misses = Math.max(0, Number(current.misses || 0) - 1);
    if(streak >= 3 && misses === 0){
      delete difficultyBank[id];
    }else{
      const intervalsInDays = [1, 3, 7, 14];
      const interval = intervalsInDays[Math.min(streak - 1, intervalsInDays.length - 1)];
      difficultyBank[id] = {
        ...current,
        misses,
        streak,
        lastReviewed: now,
        dueAt: now + interval * 24 * 60 * 60 * 1000
      };
    }
  }

  await saveDifficultyBank();
}

function escapeHtml(value){
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function finishSentence(value){
  const clean = String(value).trim().replace(/[.!?]+$/g, '');
  return clean.charAt(0).toUpperCase() + clean.slice(1) + '.';
}

function dictationSentence(question){
  const phrase = String(question.en).trim().replace(/[.!?]+$/g, '');
  const week = Number(question.sourceWeek);

  if(question.cat === 'daily'){
    return finishSentence(`The expression I am practicing today is ${phrase}`);
  }
  if(week === 1){
    return question.cat === 'entrevista'
      ? finishSentence(`In a technical interview, they might ask me to ${phrase}`)
      : finishSentence(`In this situation, I need to ${phrase}`);
  }
  if(week === 2) return finishSentence(`Right now, I am ${phrase}`);
  if(week === 3) return finishSentence(`Yesterday, I ${phrase}`);
  if(week === 4){
    return question.cat === 'entrevista'
      ? finishSentence(`In the interview, we compared ${phrase}`)
      : finishSentence(`In this situation, I need ${phrase}`);
  }
  if(week === 5){
    return question.cat === 'entrevista'
      ? finishSentence(`In the interview, they might ask me to ${phrase}`)
      : finishSentence(`I am looking for ${phrase}`);
  }
  if(week === 6){
    return question.cat === 'entrevista'
      ? finishSentence(`In the interview, I explained that I ${phrase}`)
      : finishSentence(`My plan is to ${phrase}`);
  }
  if(week === 7) return finishSentence(`In this situation, I ${phrase}`);
  if(week === 8) return finishSentence(`I ${phrase}`);
  if(week === 9){
    return phrase.includes(',')
      ? finishSentence(phrase)
      : finishSentence(`${phrase}, I will ask for help`);
  }
  if(week === 10) return finishSentence(phrase);
  if(week === 11) return finishSentence(`I need to ${phrase} before I continue`);
  return finishSentence(`We discussed ${phrase} during the conversation`);
}

function normalizeDictation(value){
  return String(value)
    .normalize('NFD')
    .replace(/\p{Diacritic}/gu, '')
    .toLowerCase()
    .replace(/['’]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim()
    .split(/\s+/)
    .filter(Boolean);
}

function wordDistance(a, b){
  const rows = a.length + 1;
  const cols = b.length + 1;
  const matrix = Array.from({length: rows}, () => Array(cols).fill(0));
  for(let i = 0; i < rows; i++) matrix[i][0] = i;
  for(let j = 0; j < cols; j++) matrix[0][j] = j;
  for(let i = 1; i < rows; i++){
    for(let j = 1; j < cols; j++){
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return matrix[a.length][b.length];
}

function fuzzyWordMatch(expected, actual){
  if(expected === actual) return true;
  const longest = Math.max(expected.length, actual.length);
  const tolerance = longest >= 8 ? 2 : longest >= 4 ? 1 : 0;
  return wordDistance(expected, actual) <= tolerance;
}

function compareDictation(expectedText, actualText){
  const expected = normalizeDictation(expectedText);
  const actual = normalizeDictation(actualText);
  const rows = expected.length + 1;
  const cols = actual.length + 1;
  const dp = Array.from({length: rows}, () => Array(cols).fill(0));
  for(let i = 0; i < rows; i++) dp[i][0] = i;
  for(let j = 0; j < cols; j++) dp[0][j] = j;

  for(let i = 1; i < rows; i++){
    for(let j = 1; j < cols; j++){
      const substitution = fuzzyWordMatch(expected[i - 1], actual[j - 1]) ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j - 1] + substitution,
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1
      );
    }
  }

  const aligned = [];
  let i = expected.length;
  let j = actual.length;
  while(i > 0 || j > 0){
    if(i > 0 && j > 0){
      const matches = fuzzyWordMatch(expected[i - 1], actual[j - 1]);
      const substitution = matches ? 0 : 1;
      if(dp[i][j] === dp[i - 1][j - 1] + substitution){
        aligned.push({status: matches ? 'correct' : 'wrong', expected: expected[i - 1], actual: actual[j - 1]});
        i--;
        j--;
        continue;
      }
    }
    if(i > 0 && dp[i][j] === dp[i - 1][j] + 1){
      aligned.push({status: 'missing', expected: expected[i - 1], actual: ''});
      i--;
    }else{
      aligned.push({status: 'extra', expected: '', actual: actual[j - 1]});
      j--;
    }
  }

  aligned.reverse();
  const errors = aligned.filter(item => item.status !== 'correct').length;
  const score = Math.max(0, Math.round((1 - errors / Math.max(expected.length, actual.length, 1)) * 100));
  return {aligned, errors, score, passed: errors === 0};
}

function dictationDiffMarkup(comparison){
  return comparison.aligned.map(item => {
    if(item.status === 'correct') return `<span class="diff-word correct">${escapeHtml(item.expected)}</span>`;
    if(item.status === 'wrong') return `<span class="diff-word wrong">${escapeHtml(item.actual)} → ${escapeHtml(item.expected)}</span>`;
    if(item.status === 'missing') return `<span class="diff-word missing">+ ${escapeHtml(item.expected)}</span>`;
    return `<span class="diff-word extra">− ${escapeHtml(item.actual)}</span>`;
  }).join('');
}

function buildDictationQuestions(w){
  const prioritized = dueDifficultyItems().slice(0, 3).map(item => ({...item, fromDifficulty: true}));
  const used = new Set(prioritized.map(difficultyId));
  const current = Object.entries(w.vocab)
    .filter(([cat]) => cat !== 'daily')
    .flatMap(([cat, items]) => items.map(item => ({...item, cat, sourceWeek: w.n, fromDifficulty: false})))
    .filter(item => !used.has(difficultyId(item)));
  const selected = [...prioritized, ...shuffled(current).slice(0, Math.max(0, 5 - prioritized.length))]
    .slice(0, 5)
    .map(item => ({...item, sentence: dictationSentence(item)}));
  return shuffled(selected);
}

function startDictation(w){
  dictationState[w.n] = {
    questions: buildDictationQuestions(w),
    index: 0,
    speed: 0.85,
    draft: '',
    currentResult: null,
    results: []
  };
  renderDictation(w);
}

function renderDictation(w){
  const el = document.getElementById('weeklyDictation');
  if(!el) return;
  const state = dictationState[w.n];

  if(!state){
    const dueCount = dueDifficultyItems().length;
    el.innerHTML = `
      <div class="dictation-box" role="region" aria-label="Ditado da semana ${w.n}">
        <p class="dictation-intro">Ouça cinco frases completas sem ver o texto, digite o que entendeu e receba uma correção palavra por palavra. Até três frases vêm do banco de dificuldades${dueCount ? ` (${dueCount} pendentes agora)` : ''}.</p>
        <button class="quiz-btn primary" type="button" data-dictation-action="start">Começar dictation</button>
      </div>
    `;
    el.querySelector('[data-dictation-action="start"]').addEventListener('click', () => startDictation(w));
    return;
  }

  if(state.index >= state.questions.length){
    const passed = state.results.filter(result => result.passed).length;
    const average = state.results.length
      ? Math.round(state.results.reduce((sum, result) => sum + result.score, 0) / state.results.length)
      : 0;
    el.innerHTML = `
      <div class="dictation-box dictation-summary" role="region" aria-label="Resultado do ditado da semana ${w.n}" aria-live="polite">
        <div class="dictation-summary-score">${passed}/${state.results.length}</div>
        <p class="dictation-intro">Média de correspondência: ${average}%. Os erros já foram enviados ao banco de dificuldades.</p>
        <button class="quiz-btn primary" type="button" data-dictation-action="restart">Treinar novamente</button>
        ${difficultyBankMarkup()}
      </div>
    `;
    el.querySelector('[data-dictation-action="restart"]').addEventListener('click', () => startDictation(w));
    return;
  }

  const question = state.questions[state.index];
  const result = state.currentResult;
  const progressPercent = Math.round((state.index / state.questions.length) * 100);
  el.innerHTML = `
    <div class="dictation-box" role="region" aria-label="Ditado da semana ${w.n}">
      <div class="dictation-top">
        <span class="dictation-count">Frase ${state.index + 1} de ${state.questions.length}</span>
        <span class="dictation-score">${state.results.filter(item => item.passed).length} corretas</span>
      </div>
      <div class="quiz-progress" role="progressbar" aria-label="Progresso do ditado" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progressPercent}">
        <div class="quiz-progress-fill" style="width:${progressPercent}%"></div>
      </div>
      ${question.fromDifficulty ? `<span class="quiz-origin">Banco de dificuldades · Semana ${question.sourceWeek}</span>` : ''}
      <div class="speed-control" aria-label="Velocidade da pronúncia">
        <span class="speed-label">Velocidade</span>
        ${[0.6, 0.85, 1].map(speed => `
          <button class="speed-btn" type="button" data-speed="${speed}" aria-pressed="${state.speed === speed}">${speed === 1 ? 'normal' : speed + 'x'}</button>
        `).join('')}
      </div>
      <div class="dictation-listen">
        <button class="quiz-btn primary" type="button" data-dictation-action="listen">🔊 Ouvir frase</button>
        <span class="dictation-hint" id="dictationSpeechStatus" aria-live="polite">O texto permanece escondido até a correção.</span>
      </div>
      ${result ? `
        <div class="dictation-result" aria-live="polite">
          <div class="dictation-verdict ${result.passed ? 'good' : 'needs-work'}">${result.passed ? `Boa! ${result.score}% de correspondência.` : `${result.score}% — esta expressão entrou no banco de dificuldades.`}</div>
          <div class="dictation-target"><strong>Frase real:</strong> ${escapeHtml(question.sentence)}</div>
          <div class="dictation-diff">${dictationDiffMarkup(result)}</div>
          <div class="dictation-legend">Verde = correto · vermelho = troca ou palavra ausente · amarelo riscado = palavra extra. Pequenos erros de digitação são aceitos.</div>
          <div class="quiz-actions">
            <button class="quiz-btn" type="button" data-dictation-action="listen-again">🔊 Ouvir novamente</button>
            <button class="quiz-btn primary" type="button" data-dictation-action="next">${state.index === state.questions.length - 1 ? 'Ver resultado' : 'Próxima frase'}</button>
          </div>
        </div>
      ` : `
        <label class="quiz-prompt-label" for="dictationInput">Digite exatamente o que você ouviu</label>
        <textarea class="dictation-input" id="dictationInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escreva a frase em inglês…">${escapeHtml(state.draft)}</textarea>
        <p class="dictation-hint">Enter confere a resposta · Shift + Enter cria uma nova linha.</p>
        <button class="quiz-btn correct" type="button" data-dictation-action="check">Conferir resposta</button>
      `}
    </div>
  `;

  el.querySelectorAll('[data-speed]').forEach(button => {
    button.addEventListener('click', () => {
      state.speed = Number(button.dataset.speed);
      renderDictation(w);
    });
  });

  const listen = el.querySelector('[data-dictation-action="listen"]');
  listen.addEventListener('click', event => speakEnglish(question.sentence, event.currentTarget, state.speed, 'dictationSpeechStatus'));

  if(result){
    el.querySelector('[data-dictation-action="listen-again"]').addEventListener('click', event => speakEnglish(question.sentence, event.currentTarget, state.speed, 'dictationSpeechStatus'));
    el.querySelector('[data-dictation-action="next"]').addEventListener('click', () => {
      state.index++;
      state.draft = '';
      state.currentResult = null;
      renderDictation(w);
    });
  }else{
    const input = el.querySelector('#dictationInput');
    input.addEventListener('input', () => { state.draft = input.value; });
    const checkAnswer = async button => {
      if(button.disabled) return;
      const answer = input.value.trim();
      if(!answer){
        input.focus();
        return;
      }
      button.disabled = true;
      const comparison = compareDictation(question.sentence, answer);
      state.currentResult = {...comparison, answer};
      state.results.push(state.currentResult);
      await updateDifficulty(question, comparison.passed);
      renderDictation(w);
    };
    const checkButton = el.querySelector('[data-dictation-action="check"]');
    checkButton.addEventListener('click', () => checkAnswer(checkButton));
    input.addEventListener('keydown', event => {
      if(event.key === 'Enter' && !event.shiftKey){
        event.preventDefault();
        checkAnswer(checkButton);
      }
    });
  }
}

function startWeeklyQuiz(w){
  quizState[w.n] = {
    questions: buildQuizQuestions(w),
    index: 0,
    revealed: false,
    correct: 0,
    missed: []
  };
  renderWeeklyQuiz(w);
}

async function answerQuiz(w, remembered){
  const state = quizState[w.n];
  if(!state || !state.revealed) return;
  const question = state.questions[state.index];
  if(remembered) state.correct++;
  else state.missed.push(question);
  await updateDifficulty(question, remembered);
  state.index++;
  state.revealed = false;
  renderWeeklyQuiz(w);
}

function renderWeeklyQuiz(w){
  const el = document.getElementById('weeklyQuiz');
  if(!el) return;
  const state = quizState[w.n];

  if(!state){
    const dueCount = dueDifficultyItems().length;
    el.innerHTML = `
      <div class="quiz-box" role="region" aria-label="Quiz de vocabulário da semana ${w.n}">
        <p class="quiz-intro">Veja o significado em português, tente lembrar a expressão em inglês e só então revele a resposta. São 10 perguntas: todas as categorias da semana mais até 4 dificuldades pendentes${dueCount ? ` (${dueCount} disponíveis agora)` : ''}.</p>
        <button class="quiz-btn primary" type="button" data-quiz-action="start">Começar quiz</button>
        ${difficultyBankMarkup()}
      </div>
    `;
    el.querySelector('[data-quiz-action="start"]').addEventListener('click', () => startWeeklyQuiz(w));
    return;
  }

  if(state.index >= state.questions.length){
    const percent = Math.round((state.correct / state.questions.length) * 100);
    const review = state.missed.length
      ? `<div class="quiz-review"><strong>Salvas no banco de dificuldades:</strong> ${state.missed.map(item => `${item.pt} → ${item.en}`).join(' · ')}</div>`
      : '<div class="quiz-review">Você lembrou todas as respostas desta rodada.</div>';
    el.innerHTML = `
      <div class="quiz-box quiz-result" role="region" aria-label="Resultado do quiz da semana ${w.n}" aria-live="polite">
        <div class="quiz-result-score">${state.correct}/${state.questions.length}</div>
        <p>${percent}% de acertos nesta rodada.</p>
        ${review}
        <button class="quiz-btn primary" type="button" data-quiz-action="restart">Sortear outro quiz</button>
        ${difficultyBankMarkup()}
      </div>
    `;
    el.querySelector('[data-quiz-action="restart"]').addEventListener('click', () => startWeeklyQuiz(w));
    return;
  }

  const question = state.questions[state.index];
  const completed = state.index;
  const progressPercent = Math.round((completed / state.questions.length) * 100);
  el.innerHTML = `
    <div class="quiz-box" role="region" aria-label="Quiz de vocabulário da semana ${w.n}">
      <div class="quiz-top">
        <span class="quiz-count">Pergunta ${state.index + 1} de ${state.questions.length}</span>
        <span class="quiz-score">Acertos: ${state.correct}</span>
      </div>
      <div class="quiz-progress" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progressPercent}">
        <div class="quiz-progress-fill" style="width:${progressPercent}%"></div>
      </div>
      <div aria-live="polite">
        ${question.fromDifficulty ? `<span class="quiz-origin">Revisão espaçada · Semana ${question.sourceWeek}</span>` : ''}
        <div class="quiz-prompt-label">Como se diz em inglês?</div>
        <div class="quiz-prompt">${question.pt}</div>
        ${state.revealed ? `
          <div class="quiz-answer">
            <span class="quiz-answer-text">${question.en}</span>
            <button class="speak-btn quiz-speak" type="button" aria-label="Ouvir pronúncia de ${question.en}">🔊</button>
          </div>
          <div class="quiz-actions">
            <button class="quiz-btn correct" type="button" data-quiz-answer="correct">Acertei</button>
            <button class="quiz-btn review" type="button" data-quiz-answer="review">Rever depois</button>
          </div>
        ` : `
          <button class="quiz-btn primary" type="button" data-quiz-action="reveal">Revelar resposta</button>
        `}
      </div>
    </div>
  `;

  if(state.revealed){
    el.querySelector('.quiz-speak').addEventListener('click', event => speakEnglish(question.en, event.currentTarget));
    el.querySelector('[data-quiz-answer="correct"]').addEventListener('click', () => answerQuiz(w, true));
    el.querySelector('[data-quiz-answer="review"]').addEventListener('click', () => answerQuiz(w, false));
  }else{
    el.querySelector('[data-quiz-action="reveal"]').addEventListener('click', () => {
      state.revealed = true;
      renderWeeklyQuiz(w);
    });
  }
}

function renderSetlist(w){
  const el = document.getElementById('setlist');
  el.innerHTML = '';
  w.days.forEach(d => {
    const key = dayKey(w.n, d.code);
    const isChecked = !!progress[key];
    const row = document.createElement('div');
    row.className = 'day-row';
    row.dataset.code = d.code;
    row.innerHTML = `
      <div class="day-head">
        <div class="day-check ${isChecked?'checked':''}" data-role="check">${isChecked?'✓':''}</div>
        <div class="day-name">${d.name}</div>
        <div class="day-label ${isChecked?'done':''}">${d.label}</div>
        <div class="day-time">${d.total} min</div>
        <div class="day-chevron">▾</div>
      </div>
      <div class="day-body">
        <div class="day-body-inner">
          ${d.blocks.map(b => `
            <div class="day-block">
              <div class="day-block-min">${b.min}min</div>
              <div class="day-block-text">${b.activity}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    const head = row.querySelector('.day-head');
    const body = row.querySelector('.day-body');
    const checkEl = row.querySelector('[data-role="check"]');

    head.addEventListener('click', (e) => {
      if(e.target === checkEl) return;
      const isOpen = row.classList.toggle('open');
      body.style.maxHeight = isOpen ? body.scrollHeight + 'px' : '0px';
    });

    checkEl.addEventListener('click', async (e) => {
      e.stopPropagation();
      const key2 = dayKey(w.n, d.code);
      progress[key2] = !progress[key2];
      await saveProgress();
      render();
      // re-open the same day after re-render
      const newRow = document.querySelector(`.day-row[data-code="${d.code}"]`);
      if(newRow){
        newRow.classList.add('open');
        const b = newRow.querySelector('.day-body');
        b.style.maxHeight = b.scrollHeight + 'px';
      }
    });

    el.appendChild(row);
  });
}

function render(){
  renderTrackNav();
  renderSleeve();
  updateMeter();
}

(async function init(){
  await Promise.all([loadProgress(), loadDifficultyBank()]);
  render();
})();
</script>
